<section class="section">
  <h1>Nueva tarea</h1>

  <form [formGroup]="form" (ngSubmit)="createTask()">
    <label>
      Título
      <input formControlName="title" />
    </label>

    <label>
      Descripción
      <textarea formControlName="description"></textarea>
    </label>

    <button type="submit">Crear tarea</button>
  </form>
</section>
